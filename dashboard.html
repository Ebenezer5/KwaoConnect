<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zynk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-shell">

  <div class="app-topbar">
    <div class="app-topbar-row">
      <div class="brand-mark">
        <span class="brand-dot"></span>
        <span class="brand-name">Zynk</span>
      </div>
      <button class="icon-btn" id="logout" title="Log out" aria-label="Log out">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>

    <div class="greeting">
      <div class="greeting-hi" id="welcome">Hi</div>
      <div class="greeting-contact" id="contact"></div>
    </div>
  </div>
<br><br><br>
  <div class="app-content">

    <div class="voucher">
      <div class="voucher-row">
        <div class="voucher-row-label">
          <span class="icon-chip"><i class="fa-solid fa-phone"></i></span>
          Airtime
        </div>
        <div class="voucher-row-value" id="airtime">GHS 0.00</div>
      </div>

      <div class="voucher-tear"></div>

      <div class="voucher-row">
        <div class="voucher-row-label">
          <span class="icon-chip"><i class="fa-solid fa-wifi"></i></span>
          Data
        </div>
        <div class="voucher-row-value" id="data">0 MB</div>
      </div>

      <div class="voucher-tear"></div>

      <div class="voucher-row">
        <div class="voucher-row-label">
          <span class="icon-chip"><i class="fa-solid fa-message"></i></span>
          SMS
        </div>
        <div class="voucher-row-value" id="SMS">0 MB</div>
      </div>
    </div>

    <h3 class="section-title">Top up</h3>

    <div class="tile-grid">
      <button class="tile" id="buyAirtime">
        <span class="icon-chip"><i class="fa-solid fa-phone"></i></span>
        <span class="tile-label">Airtime</span>
      </button>

      <button class="tile" id="buyData">
        <span class="icon-chip"><i class="fa-solid fa-wifi"></i></span>
        <span class="tile-label">Data</span>
      </button>

      <button class="tile" id="buySMS">
        <span class="icon-chip"><i class="fa-solid fa-message"></i></span>
        <span class="tile-label">SMS</span>
      </button>
    </div>

    <div class="promo-slider">
      <div class="promo-track" id="promoTrack">
        <div class="promo-slide"><img src="pics/airtime.png" alt="50% bonus airtime promotion"></div>
        <div class="promo-slide"><img src="pics/data.png" alt="Double data deal promotion"></div>
      </div>
    </div>
    <div class="promo-dots" id="promoDots">
      <span class="promo-dot active"></span>
      <span class="promo-dot"></span>
    </div>

  </div>

  <nav class="bottom-nav">
    <button class="nav-item active">
      <i class="fa-solid fa-house"></i>
      Home
    </button>
    <button class="nav-item" id="profile">
      <i class="fa-solid fa-user"></i>
      Profile
    </button>
  </nav>

</div>

<div id="welcomePopup" class="popup-overlay">
  <div class="popup-card">
    <div class="icon-chip"><i class="fa-solid fa-wallet"></i></div>
    <h2>Welcome to Zynk</h2>
    <p id="popupMessage"></p>
    <button id="closePopup" class="btn btn-primary">Start exploring</button>
  </div>
</div>

<script>
(function () {

const welcomeUser = document.getElementById("welcome");
const contact = document.getElementById("contact");
const logoutBtn = document.getElementById("logout");

const airtime = document.getElementById("airtime");
const data = document.getElementById("data");
const SMS = document.getElementById("SMS");

const buyAirtime = document.getElementById("buyAirtime");
const buyData = document.getElementById("buyData");
const buySMS = document.getElementById("buySMS");

const profileBtn = document.getElementById("profile");

const promoTrack = document.getElementById("promoTrack");
const promoSlides = document.querySelectorAll(".promo-slide");
const promoDots = document.querySelectorAll(".promo-dot");

const popup = document.getElementById("welcomePopup");
const popupMessage = document.getElementById("popupMessage");
const closePopup = document.getElementById("closePopup");

let currentUser = JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser) {
    window.location.href = "index.html";
    return;
}

if (popup && !currentUser.welcomeShown) {

    popupMessage.textContent =
        `You have GHS ${currentUser.momo.toFixed(2)} in your MoMo account. Enjoy our services!`;

    popup.classList.add("active");

    currentUser.welcomeShown = true;

    localStorage.setItem("currentUser", JSON.stringify(currentUser));

    const users = JSON.parse(localStorage.getItem("users")) || [];
    const userIndex = users.findIndex(user => user.ID === currentUser.ID);

    if (userIndex !== -1) {
        users[userIndex] = currentUser;
        localStorage.setItem("users", JSON.stringify(users));
    }
}

if (closePopup) {
    closePopup.addEventListener("click", () => {
        popup.classList.remove("active");
    });
}

function capitalizeEachWord(text) {
    return text.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
}

if (welcomeUser) {
    welcomeUser.textContent = `Hi, ${capitalizeEachWord(currentUser.firstName)}`;
}

if (contact) {
    contact.textContent = currentUser.contact;
}

if (airtime) {
    airtime.textContent = `GHS ${currentUser.airtime.toFixed(2)}`;
}

if (data) {
    data.textContent = `${(currentUser.data ?? 0).toLocaleString()} MB`;
}

if (SMS) {
    SMS.textContent = `${currentUser.SMS ?? 0}`;
}

function logout() {
    localStorage.removeItem("currentUser");
    window.location.href = "index.html";
}

if (logoutBtn) logoutBtn.addEventListener("click", logout);

if (profileBtn) {
    profileBtn.addEventListener("click", () => {
        window.location.href = "features/profile.html";
    });
}

let index = 0;

function showSlide(i) {
    if (!promoTrack) return;

    index = i;
    promoTrack.style.transform = `translateX(-${index * 100}%)`;

    promoDots.forEach(dot => dot.classList.remove("active"));
    if (promoDots[index]) promoDots[index].classList.add("active");
}

function nextSlide() {
    index++;
    if (index >= promoSlides.length) index = 0;
    showSlide(index);
}

if (promoSlides.length > 0) {
    setInterval(nextSlide, 5000);
}

promoDots.forEach((dot, i) => {
    dot.addEventListener("click", () => showSlide(i));
});

if (buyAirtime) {
    buyAirtime.addEventListener("click", () => {
        window.location.href = "features/airtime.html";
    });
}

if (buyData) {
    buyData.addEventListener("click", () => {
        window.location.href = "features/data.html";
    });
}

if (buySMS) {
    buySMS.addEventListener("click", () => {
        window.location.href = "features/sms.html";
    });
}

})();
</script>
</body>
</html>
