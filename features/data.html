<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zynk — Buy data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content" style="max-width:460px;">

    <a href="../dashboard.html" class="back-link">
      <i class="fas fa-arrow-left"></i> Dashboard
    </a>

    <form id="dataForm" novalidate>
      <div class="form-card">
        <div class="page-icon"><i class="fa-solid fa-wifi"></i></div>
        <h2>Buy data</h2>

        <div style="display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px;">
          <h3 class="section-title" style="margin:0;">Bundles</h3>
        </div>

        <div class="data-grid" id="dataGrid"></div>
        <span id="bundleError" class="error-text"></span>

        <h3 class="section-title">Who is this for?</h3>

        <div class="pill-group">
          <label class="pill">
            <input type="radio" name="purchaseFor" value="self" checked>
            <span class="pill-face">Myself</span>
          </label>
          <label class="pill">
            <input type="radio" name="purchaseFor" value="someone">
            <span class="pill-face">Someone else</span>
          </label>
        </div>

        <div id="someoneWrapper" class="field hidden">
          <label for="someoneNumber">Recipient's number</label>
          <div class="field-input">
            <i class="fa-solid fa-phone"></i>
            <input id="someoneNumber" type="text" placeholder="024 000 0000">
          </div>
          <span id="someoneError" class="error-text"></span>
        </div>

        <button type="submit" class="btn btn-primary">Continue</button>
      </div>
    </form>

  </div>
</div>

<script>
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if (!currentUser) {
    window.location.href = "../index.html";
}

const form = document.getElementById("dataForm");
const dataGrid = document.getElementById("dataGrid");
const networkInputs = document.querySelectorAll('input[name="network"]');

const purchaseRadios = document.querySelectorAll('input[name="purchaseFor"]');
const someoneWrapper = document.getElementById("someoneWrapper");
const someoneInput = document.getElementById("someoneNumber");

const someoneError = document.getElementById("someoneError");
const bundleError = document.getElementById("bundleError");

// Reference market pricing (non-expiry bundles), GHS.
// MTN and AT figures reflect current Ghanaian reseller rates.
// Telecel figures are estimated between the two — swap in your own
// Berimah Data Hub markup pricing here once confirmed.
const PRICING = {
    zynk: [
        { mb: 97, price: 1.00 }, { mb: 478, price: 3.00 }, { mb: 606, price: 5.00 },
        { mb: 800, price: 10.00 }, { mb: 1000, price: 13.00 }, { mb: 275000, price: 300.00 },
      ]
};

let zynkData = "zynk";
let selectedAmount = null;   // MB to credit
let  selectedPrice = null;    // GHS cost to charge

function renderBundles(network) {
    dataGrid.innerHTML = "";
    selectedAmount = null;
    selectedPrice = null;
    bundleError.textContent = "";

    PRICING[network].forEach(pkg => {
        const label = document.createElement("label");
        label.className = "data-card";
        label.innerHTML = `
            <input type="radio" name="dataPackage" value="${pkg.mb}">
            <span class="data-face">
                <span class="gb">${pkg.mb.toLocaleString()} MB</span>
                <span class="price">GHS ${pkg.price.toFixed(2)}</span>
            </span>
        `;

        label.querySelector("input").addEventListener("change", () => {
            selectedAmount = pkg.mb;
            selectedPrice = pkg.price;
        });

        dataGrid.appendChild(label);
    });
}

networkInputs.forEach(radio => {
    radio.addEventListener("change", () => {
        if (radio.checked) {
            zynkData = radio.value;
            renderBundles(zynkData);
        }
    });
});

renderBundles(zynkData);

purchaseRadios.forEach(radio => {
    radio.addEventListener("change", () => {

        if (radio.value === "someone" && radio.checked) {
            someoneWrapper.classList.remove("hidden");
        } else {
            someoneWrapper.classList.add("hidden");
            someoneInput.value = "";
            someoneError.textContent = "";
        }
    });
});

form.addEventListener("submit", function (e) {

    e.preventDefault();

    bundleError.textContent = "";
    someoneError.textContent = "";

    if (!selectedAmount) {
        bundleError.textContent = "Select a bundle to continue";
        return;
    }

    const purchaseType = document.querySelector('input[name="purchaseFor"]:checked').value;

    let purchaseData = {
        service: "data",
        network: zynkData,
        amount: selectedAmount,   // MB to credit
        price: selectedPrice,     // GHS to charge
        type: purchaseType,
        number: null
    };

    if (purchaseType === "someone") {

        const number = someoneInput.value.trim();

        if (!/^\d{10}$/.test(number)) {
            someoneError.textContent = "Enter a valid phone number";
            return;
        }

        purchaseData.number = number;
    }

    localStorage.setItem("purchaseAmount", selectedPrice);
    localStorage.setItem("purchaseData", JSON.stringify(purchaseData));
    localStorage.setItem("paymentPending", "true");

    window.location.href = "../features/payment.html";
});
</script>
</body>
</html>
