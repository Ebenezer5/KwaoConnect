<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zynk — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="app-shell">

  <div class="profile-hero">
    <a href="../dashboard.html" class="back-link" style="color:rgba(255,255,255,0.8); padding-top:0;">
      <i class="fas fa-arrow-left"></i> Dashboard
    </a>
    <div class="profile-avatar" id="initials"></div>
  </div>

  <div class="profile-card">
    <div class="profile-info">
      <h2 id="fullName"></h2>
      <p class="mono" id="contact"></p>
      <p class="joined" id="dateJoined"></p>
    </div>
  </div>

</div>

<script>
(function () {

const fullNameEl = document.getElementById("fullName");
const contact = document.getElementById("contact");
const dateJoinedEl = document.getElementById("dateJoined");
const initialsDiv = document.getElementById("initials");

const currentUser = JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser) {
    window.location.href = "../index.html";
    return;
}

const fullName =
    (currentUser.firstName || "") +
    (currentUser.lastName ? " " + currentUser.lastName : "");

function capitalizeEachWord(text) {
    return text.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
}

fullNameEl.textContent = capitalizeEachWord(fullName.trim());
contact.textContent = currentUser.contact;

const firstInitial = currentUser.firstName
    ? currentUser.firstName.charAt(0).toUpperCase()
    : "";

const lastInitial = currentUser.lastName
    ? currentUser.lastName.charAt(0).toUpperCase()
    : "";

initialsDiv.textContent = firstInitial + lastInitial;

if (currentUser.dateJoined) {
    const formattedDate = new Date(currentUser.dateJoined)
        .toLocaleDateString("en-GB", {
            year: "numeric",
            month: "long",
            day: "numeric"
        });

    dateJoinedEl.textContent = "Member since " + formattedDate;
}

})();
</script>
</body>
</html>
