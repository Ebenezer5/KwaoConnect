<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zynk — Buy SMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="app-shell">
  <div class="app-content" style="max-width:420px;">

    <a href="../dashboard.html" class="back-link">
      <i class="fas fa-arrow-left"></i> Dashboard
    </a>

    <form id="smsForm" novalidate>
      <div class="form-card">
        <div class="page-icon"><i class="fa-solid fa-message"></i></div>
        <h2>Buy SMS bundle</h2>
        <br>
        <div class="data-grid" id="smsGrid" style="grid-template-columns: repeat(3, 1fr);"></div>
        <span id="packageError" class="error-text"></span>

        <h3 class="section-title">Payment method</h3>

        <label class="method-card">
          <input type="radio" name="paymentMethod" value="airtime">
          <span class="method-face">
            <span class="icon-chip"><i class="fa-solid fa-phone"></i></span>
            <span class="method-face-text">
              <span class="method-face-title">Airtime balance</span>
            </span>
          </span>
        </label>

        <label class="method-card">
          <input type="radio" name="paymentMethod" value="momo">
          <span class="method-face">
            <span class="icon-chip"><i class="fa-solid fa-wallet"></i></span>
            <span class="method-face-text">
              <span class="method-face-title">Mobile Money</span>
            </span>
          </span>
        </label>

        <p id="balanceInfo" class="form-sub" style="margin:6px 0 0;"></p>

        <button type="submit" class="btn btn-primary mt-16">Continue</button>
      </div>
    </form>

  </div>
</div>

<script>
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if (!currentUser) {
    window.location.href = "../index.html";
}

const smsGrid = document.getElementById("smsGrid");
const form = document.getElementById("smsForm");

const paymentMethod = document.querySelectorAll('input[name="paymentMethod"]');

const packageError = document.getElementById("packageError");
const balanceInfo = document.getElementById("balanceInfo");

let selectedSMS = null;
let price = null;

const packages = [
    { sms: 5, price: 1 },
    { sms: 50, price: 5 },
    { sms: 100, price: 10 }
];

packages.forEach(pkg => {

    const label = document.createElement("label");
    label.className = "data-card";
    label.innerHTML = `
        <input type="radio" name="smsPackage" value="${pkg.sms}">
        <span class="data-face">
            <span class="gb">${pkg.sms}</span>
            <span class="price">GHS ${pkg.price}</span>
        </span>
    `;

    label.querySelector("input").addEventListener("change", () => {
        selectedSMS = pkg.sms;
        price = pkg.price;
    });

    smsGrid.appendChild(label);
});

paymentMethod.forEach(radio => {
    radio.addEventListener("change", () => {

        if (radio.value === "airtime" && radio.checked) {
            balanceInfo.textContent =
                `Your Airtime Balance: GHS ${currentUser.airtime.toFixed(2)}`;
        }
        else if (radio.value === "momo" && radio.checked) {
            balanceInfo.textContent =
                `Your MoMo Balance: GHS ${currentUser.momo.toFixed(2)}`;
        }
    });
});

form.addEventListener("submit", (e) => {

    e.preventDefault();

    packageError.textContent = "";

    if (!selectedSMS) {
        packageError.textContent = "Select a package";
        return;
    }

    const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked');

    if (!selectedMethod) {
        packageError.textContent = "Select a payment method";
        return;
    }

    const method = selectedMethod.value;

    if (method === "airtime") {

        if (currentUser.airtime < price) {
            packageError.textContent = "Insufficient Airtime balance";
            return;
        }

        currentUser.airtime -= price;
    }

    if (method === "momo") {

        if (currentUser.momo < price) {
            packageError.textContent = "Insufficient Mobile Money balance";
            return;
        }

        currentUser.momo -= price;
    }

    currentUser.SMS += selectedSMS;

    let users = JSON.parse(localStorage.getItem("users"));
    const index = users.findIndex(u => u.ID === currentUser.ID);
    users[index] = currentUser;

    localStorage.setItem("users", JSON.stringify(users));
    localStorage.setItem("currentUser", JSON.stringify(currentUser));

    localStorage.setItem("purchaseAmount", price);
    localStorage.setItem("purchaseData", JSON.stringify({
        service: "sms",
        amount: selectedSMS,
        price: price,
        type: "self",
        number: null
    }));

    form.querySelector("button").disabled = true;

    window.location.href = "../features/success.html";
});
</script>
</body>
</html>
